name: Test

on:
  pull_request:

permissions:
  contents: read

env:
  # Task's builtin tar on Windows has no -z; use the runner's.
  TASK_CORE_UTILS: 'false'

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ github.token }}

      # rust-toolchain.toml brings every target the check crosses to.
      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # Leave RUSTFLAGS unset; it would override the rustflags in .cargo/config.toml.
          rustflags: ""
          cache-shared-key: cargo-check

      - name: Check
        run: task check

  test:
    name: ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - runs-on: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
          - runs-on: macos-26
            target: aarch64-apple-darwin
          - runs-on: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ github.token }}

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
          # Leave RUSTFLAGS unset; it would override the rustflags in .cargo/config.toml.
          rustflags: ""
          cache-shared-key: cargo-${{ runner.os }}-${{ runner.arch }}

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Test
        run: task test -- --target ${{ matrix.target }}

      # Verify the release build and tarball before merging; the release builds them again.
      - name: Build
        run: task build TARGET=${{ matrix.target }}
