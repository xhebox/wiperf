[package]
name = "wiperf"
version = "0.1.0"
edition = "2024"
description = "Transport-independent throughput benchmark library and CLI"
license = "MIT"
repository = "https://github.com/xhebox/wiperf"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[lib]
name = "wiperf"
path = "src/lib.rs"

[[bin]]
name = "wiperf"
path = "src/main.rs"

[dependencies]
argh = "0.1"
completion = { package = "completion-async", version = "0.2.4" }
event-listener = "5"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc", "async-await", "async-await-macro"] }
getrandom = "0.3"
log = { version = "0.4.34", features = ["std", "kv"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
let_underscore_drop = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"

[lints.cargo]
unused_dependencies = "deny"

[lints.clippy]
dbg_macro = "deny"
disallowed_methods = "deny"
len_without_is_empty = "allow"
len_zero = "allow"
print_stderr = "deny"
print_stdout = "deny"
pub_underscore_fields = "deny"
redundant_pub_crate = "deny"
tabs_in_doc_comments = "allow"
wildcard_imports = "deny"
